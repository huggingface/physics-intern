[project]
name = "physics-intern"
version = "0.1.0"
description = "Multi-agent scientific research system"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "sympy>=1.13",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    # Floor pinned to address CVE-2026-48710 (GHSA-86qp-5c8j-p5mr):
    # Host header poisons request.url.path; path-based middleware can be bypassed.
    "starlette>=1.0.1",
]

[project.optional-dependencies]
quality = ["pre-commit>=4.6.0", "ruff>=0.15.12"]
testing = ["pytest>=8.0", "pytest-cov>=7.1.0", "huggingface-hub>=0.25"]
openai = ["openai>=1.0"]
google = ["google-genai>=1.0"]
huggingface = ["huggingface-hub>=0.25"]
all-providers = ["openai>=1.0", "google-genai>=1.0", "huggingface-hub>=0.25"]
local = [
    # DeepSeek V4 support requires vLLM 0.20+. The H100 Slurm cluster uses the
    # cu129 nightly wheel installed by serve/upgrade_vllm.sh. Keep the project
    # dependency broad because the cu129 nightly is installed from a custom
    # wheel index rather than from the normal uv lock.
    "vllm>=0.19.1; sys_platform == 'linux'",
    # GLM-5.1's `glm_moe_dsa` architecture requires transformers >= 5.5.4;
    # vLLM only requires >=4.56.0 so we pin the floor explicitly.
    "transformers>=5.5.4; sys_platform == 'linux'",
    "hf-transfer; sys_platform == 'linux'",
    # GLM-5.1 and DeepSeek V4 need DeepGEMM kernels for sparse attention.
    # Wheel is checked into the repo (it's not on PyPI); see [tool.uv.sources].
    "deep-gemm; sys_platform == 'linux'",
]

[tool.uv.sources]
deep-gemm = { path = "deep_gemm-2.5.0+891d57b-cp313-cp313-linux_x86_64.whl" }

[project.scripts]
physics_intern = "physics_intern.main:main"
physics_intern_oneshot = "physics_intern.one_shot.runner:main"
physics_intern_rsa = "physics_intern.rsa.runner:main"
physics_intern_autophysicist = "physics_intern.autophysicist.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_intern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
omit = [
    "src/physics_intern/main.py",
    "src/physics_intern/*/__main__.py",
    "src/physics_intern/*/runner.py",
    "src/physics_intern/baselines/cli.py",
    "src/physics_intern/providers/anthropic.py",
    "src/physics_intern/providers/google.py",
    "src/physics_intern/providers/huggingface.py",
    "src/physics_intern/providers/openai.py",
    "src/physics_intern/providers/vllm.py",
    "src/physics_intern/verification/cli.py",
]
source = ["physics_intern"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff.lint.per-file-ignores]
"scripts/test_model.py" = ["E402"]
"src/physics_intern/main.py" = ["E402"]
"src/physics_intern/one_shot/runner.py" = ["E402"]
"src/physics_intern/rsa/runner.py" = ["E402"]
"src/physics_intern/autophysicist/runner.py" = ["E402"]
"src/physics_intern/two_steps/runner.py" = ["E402"]
"src/physics_intern/verification/cli.py" = ["E402"]
